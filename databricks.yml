# Asset Bundle de la solucion FMCG: jobs Bronze, Silver, Gold y el maestro fmcg-medallion-pipeline
# (Bronze -> Silver -> Gold -> reconciliacion) y el dashboard AI/BI (resources/dashboard.yml).
# Desplegado en dev (ver docs/ESTADO.md, docs/10b y docs/11).
# Validar:   databricks bundle validate -t dev
# Desplegar: databricks bundle deploy -t dev   (con DATABRICKS_BUNDLE_ENGINE=direct; ver trampas en ESTADO)
bundle:
  name: fmcg-medallion-lakehouse

variables:
  catalog:
    description: Catalogo de Unity Catalog de la solucion
    default: fmcg_lakehouse
  warehouse_id:
    description: ID del SQL Warehouse (export BUNDLE_VAR_warehouse_id=<id>)

include:
  - resources/silver_job.yml
  - resources/gold_job.yml
  - resources/pipeline_job.yml
  - resources/dashboard.yml

# Sincroniza solo el codigo necesario al workspace.
sync:
  include:
    - src/bronze/**
    - src/silver/**
    - src/gold/**
    - src/pipeline/**
  exclude:
    - src/datagen/**

targets:
  dev:
    mode: development
    default: true
    # El host sale de la variable de entorno DATABRICKS_HOST (ver README).

resources:
  jobs:
    bronze_ingest:
      name: fmcg-bronze-ingest
      description: Ingesta Bronze (Auto Loader) de 2 companias x 4 fuentes; una tarea por fuente, en paralelo.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - pyyaml
      tasks:
        - task_key: madre_customers
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          environment_key: default
          spark_python_task:
            python_file: src/bronze/ingest.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--company", "madre", "--source", "customers"]
        - task_key: madre_products
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          environment_key: default
          spark_python_task:
            python_file: src/bronze/ingest.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--company", "madre", "--source", "products"]
        - task_key: madre_prices
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          environment_key: default
          spark_python_task:
            python_file: src/bronze/ingest.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--company", "madre", "--source", "prices"]
        - task_key: madre_orders
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          environment_key: default
          spark_python_task:
            python_file: src/bronze/ingest.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--company", "madre", "--source", "orders"]
        - task_key: hija_customers
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          environment_key: default
          spark_python_task:
            python_file: src/bronze/ingest.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--company", "hija", "--source", "customers"]
        - task_key: hija_products
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          environment_key: default
          spark_python_task:
            python_file: src/bronze/ingest.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--company", "hija", "--source", "products"]
        - task_key: hija_prices
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          environment_key: default
          spark_python_task:
            python_file: src/bronze/ingest.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--company", "hija", "--source", "prices"]
        - task_key: hija_orders
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          environment_key: default
          spark_python_task:
            python_file: src/bronze/ingest.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--company", "hija", "--source", "orders"]
